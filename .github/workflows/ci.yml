name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      # Read-only lint (the `lint` script auto-fixes; use lint:check in CI).
      - name: Lint API
        run: pnpm --filter api run lint:check

      - name: Unit tests (API)
        run: pnpm --filter api test

      - name: E2E tests (API)
        run: pnpm --filter api run test:e2e

      - name: API build
        run: pnpm --filter api build
